org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Compile build-logic's Kotlin in the Gradle daemon: the Kotlin daemon writes under ~/Library, which sandboxes block.
kotlin.compiler.execution.strategy=in-process

# Knobs read by the inventory.java convention plugin (build-logic/).
inventory.javaRelease=25
inventory.minLineCoverage=0.80
inventory.parserVersion=1.0.0
inventory.modelVersion=0.1.0
inventory.libraryRelease=21
