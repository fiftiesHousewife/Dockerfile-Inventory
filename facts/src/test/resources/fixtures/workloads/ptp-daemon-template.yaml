---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: linuxptp-daemon
  namespace: {{.Namespace}}
  annotations:
    release.openshift.io/version: "{{.ReleaseVersion}}"
spec:
  selector:
    matchLabels:
      app: linuxptp-daemon
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 33%
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        app: linuxptp-daemon
        role: ptp
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - operator: Exists
      serviceAccountName: linuxptp-daemon
      priorityClassName: "system-node-critical"
      containers:
        {{ if (eq .EnableEventPublisher true) }}
        {{ if .SideCarV2 }}
        - name: cloud-event-proxy
          image: {{ .SideCarV2 }}
          imagePullPolicy: {{ .ImagePullPolicy }}
          command: ["/usr/local/bin/cloud-event-proxy"]
