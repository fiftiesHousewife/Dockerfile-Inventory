# The one version catalogue, shared by build-logic and every module.
[versions]
rewrite = "8.90.4"
jetbrains-annotations = "26.1.0"
junit = "6.1.3"
assertj = "3.27.7"
jspecify = "1.0.1"
spotbugs-plugin = "6.5.13"
spotbugs = "4.10.5"
slf4j = "2.0.20"
versions-plugin = "0.67.0"
# Read by settings.gradle.kts, whose plugins block cannot use this catalogue.
foojay-resolver = "1.0.0"
jacoco = "0.8.16"
jackson = "3.2.4"

[libraries]
# Parsing (Phase 1). Core rewrite modules only, so the core BOM, not the recipe BOM. Pin exactly: the
# rewrite-docker APIs are marked unstable, and an upgrade is its own change (AGENTS.md).
rewrite-bom = { module = "org.openrewrite:rewrite-bom", version.ref = "rewrite" }
rewrite-core = { module = "org.openrewrite:rewrite-core" }
rewrite-docker = { module = "org.openrewrite:rewrite-docker" }
# rewrite's classes carry @Language; without the annotation on the classpath javac warns, and -Werror fails.
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

# JSON for GitHub REST and GraphQL responses and the JSONL outputs.
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Gradle plugins used by build-logic. Declared as libraries so build-logic can depend on them and the
# up-to-date check (inventory.dependency-updates) can see them.
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
gradle-versions-plugin = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "versions-plugin" }
foojay-resolver = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay-resolver" }

# SpotBugs logs through slf4j-simple at a version its plugin pins; pinned here so it stays current.
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
